<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="360" viewBox="0,0,480,360"><g transform="translate(0,-0.00001)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(48.6645,28.79905) scale(0.27883,0.27883)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">WASD/⇧⇦⇩⇨ - 移動</tspan><tspan x="0" dy="46.150000000000006px">1 - 打撃</tspan><tspan x="0" dy="46.150000000000006px">2 - 動きを作成 (長押し、マウスの向きへ)</tspan><tspan x="0" dy="46.150000000000006px">　徐々に加速していく</tspan><tspan x="0" dy="46.150000000000006px">　キーを離すか24フレーム作るとトレース</tspan><tspan x="0" dy="46.150000000000006px">　2+1 - 当たった相手に攻撃 (速いほどダメージ大きい) </tspan><tspan x="0" dy="46.150000000000006px">　2+3 - 触れた相手をフリーズさせる</tspan><tspan x="0" dy="46.150000000000006px">　2+4 - 軌道に沿って空気をフリーズさせる</tspan><tspan x="0" dy="46.150000000000006px">3 - フリーズさせる (次の攻撃のダメージが増える)</tspan><tspan x="0" dy="46.150000000000006px">4 - 空気をフリーズさせる</tspan><tspan x="0" dy="46.150000000000006px">5 - 24fpsパンチ (長押し)</tspan><tspan x="0" dy="46.150000000000006px">7 - 領域展開 時胞月宮殿 (ON/OFF)</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">WASD/⇧⇦⇩⇨ - Movement</tspan><tspan x="0" dy="46.150000000000006px">1 - Punch</tspan><tspan x="0" dy="46.150000000000006px">2 - Make Moves (Hold Down Key, Towards The Cursor)</tspan><tspan x="0" dy="46.150000000000006px">　Accelerates Gradually</tspan><tspan x="0" dy="46.150000000000006px">　Traces Them After 24 Frames Or When Key Released</tspan><tspan x="0" dy="46.150000000000006px">　2+1 - Attack Opponents On Trajectory (Damage Increases With Speed)</tspan><tspan x="0" dy="46.150000000000006px">　2+3 - Freeze Opponents On Trajectory</tspan><tspan x="0" dy="46.150000000000006px">　2+4 - Freeze Air Along Trajectory</tspan><tspan x="0" dy="46.150000000000006px">3 - Freeze Opponent (Increases Damage Of Next Attack)</tspan><tspan x="0" dy="46.150000000000006px">4 - Freeze Air</tspan><tspan x="0" dy="46.150000000000006px">5 - 24fps Barrage (Hold)</tspan><tspan x="0" dy="46.150000000000006px">7 - Domain Expansion: Time Cell Moon Palace (Toggle)</tspan></text><path d="M0,360.00001v-360h480v360z" fill="none" stroke="none" stroke-width="0"></path><text transform="translate(-80.39999,131.39999) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"> </tspan></text></g></g></svg>