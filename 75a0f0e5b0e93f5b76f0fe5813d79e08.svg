<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="515.75" height="360" viewBox="0,0,515.75,360"><g transform="translate(35.75,-0.00001)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M0,360.00001v-360h480v360z" fill="none" stroke-width="0"></path><text transform="translate(77.82704,29.50081) scale(0.35255,0.35255)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">WASD/⇧⇦⇩⇨ - 移動</tspan><tspan x="0" dy="46.150000000000006px">1 - 打撃 (ランダムで黒閃になる)</tspan><tspan x="0" dy="46.150000000000006px">2 - 不義遊戯 (マウスの位置の相手と入れ替わる)</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+2 - 手を叩く (入れ替わらない)</tspan><tspan x="0" dy="46.150000000000006px">3 - 石を投げる (不義遊戯で使える)</tspan><tspan x="0" dy="46.150000000000006px">4 - 連続攻撃</tspan><tspan x="0" dy="46.150000000000006px">5 - 横攻撃</tspan><tspan x="0" dy="46.150000000000006px">6 - 縦攻撃</tspan><tspan x="0" dy="46.150000000000006px">7 - シン・陰流 簡易領域 (ON/OFF)</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">WASD/⇧⇦⇩⇨ - Movement</tspan><tspan x="0" dy="46.150000000000006px">1 - Punch (Becomes Black Flash Randomly)</tspan><tspan x="0" dy="46.150000000000006px">2 - Boogie Woogie (Switch Places With</tspan><tspan x="0" dy="46.150000000000006px">　The Target At The Cursor)</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+2 - Clap (Don't Switch Places)</tspan><tspan x="0" dy="46.150000000000006px">3 - Throw Stone (Can Be Used In Boogie Woogie)</tspan><tspan x="0" dy="46.150000000000006px">4 - Continuous Attack</tspan><tspan x="0" dy="46.150000000000006px">5- Horizontal Attack</tspan><tspan x="0" dy="46.150000000000006px">6 - Vertical Attack</tspan><tspan x="0" dy="46.150000000000006px">7 - New Shadow Style: Simple Domain (Toggle)</tspan></text><text transform="translate(-35.5,159.5) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"> </tspan></text></g></g></svg>