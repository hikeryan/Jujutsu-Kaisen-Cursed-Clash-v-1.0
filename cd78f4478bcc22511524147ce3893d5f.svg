<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="551.75" height="360" viewBox="0,0,551.75,360"><g transform="translate(71.75,0)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(12.77141,21.59951) scale(0.35203,0.35203)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">WASD/⇧⇦⇩⇨ - 移動</tspan><tspan x="0" dy="46.150000000000006px">1 - 打撃 (ランダムで黒閃になる)</tspan><tspan x="0" dy="46.150000000000006px">2 - 横攻撃</tspan><tspan x="0" dy="46.150000000000006px">3 - 縦攻撃</tspan><tspan x="0" dy="46.150000000000006px">4 - 相手を線分 (マウスの位置)</tspan><tspan x="0" dy="46.150000000000006px">　マウスを7:3の点に合わせて攻撃するとクリティカルヒット</tspan><tspan x="0" dy="46.150000000000006px">5 - 十劃呪法 瓦落瓦落</tspan><tspan x="0" dy="46.150000000000006px">　マウスを7:3の点に合わせてもう一度押すと発動</tspan><tspan x="0" dy="46.150000000000006px">6 - 時間外労働 (30秒間呪力の回復速度を制限、その後の30秒間は回復が</tspan><tspan x="0" dy="46.150000000000006px">　速くなる)</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">WASD/⇧⇦⇩⇨ - Movement</tspan><tspan x="0" dy="46.150000000000006px">1 - Punch (Becomes Black Flash Randomly)</tspan><tspan x="0" dy="46.150000000000006px">2 - Horizontal Attack</tspan><tspan x="0" dy="46.150000000000006px">3 - Vertical Attack</tspan><tspan x="0" dy="46.150000000000006px">4 - Divide Opponent's Length (At The Cursor)</tspan><tspan x="0" dy="46.150000000000006px">　Attack With Cursor At The 7:3 Point For A Critical Hit</tspan><tspan x="0" dy="46.150000000000006px">5 - Ratio Technique: Collapse</tspan><tspan x="0" dy="46.150000000000006px">　Press Again With Cursor At The 7:3 Point To Activate</tspan><tspan x="0" dy="46.150000000000006px">6 - Overtime (Limit Cursed Energy Recovery Speed For 30 Seconds,</tspan><tspan x="0" dy="46.150000000000006px">　Recovery Speed Increases For The Next 30 Seconds)</tspan></text><path d="M0,360v-360h480v360z" fill="none" stroke="none" stroke-width="0"></path><text transform="translate(-71.5,127.5) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"> </tspan></text><text transform="translate(-26.39999,217.2) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"> </tspan></text><text transform="translate(-49.39999,225.2) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"> </tspan></text></g></g></svg>