<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="360" viewBox="0,0,480,360"><g transform="translate(0,-0.00001)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><path d="M0,360.00001v-360h480v360z" fill="none" stroke="none"></path><text transform="translate(73.93783,20.05969) scale(0.30806,0.30806)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">WASD/⇧⇦⇩⇨ - 移動</tspan><tspan x="0" dy="46.150000000000006px">1 - 打撃</tspan><tspan x="0" dy="46.150000000000006px">2 - 呪霊を取り込む (敵側のHPが半分以下の呪霊)</tspan><tspan x="0" dy="46.150000000000006px">3 - 呪霊を変更</tspan><tspan x="0" dy="46.150000000000006px">4 - 呪霊を取り出す</tspan><tspan x="0" dy="46.150000000000006px">5 - 呪霊を戻す</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+5 - 呪霊を全て戻す</tspan><tspan x="0" dy="46.150000000000006px">6 - 極ノ番「うずまき」</tspan><tspan x="0" dy="46.150000000000006px">　(「うずまきに使用」した呪霊を消費)</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+6 - 呪霊をうずまきに使用</tspan><tspan x="0" dy="46.150000000000006px">7 - シン・陰流 簡易領域 (ON/OFF)</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">WASD/⇧⇦⇩⇨ - Movement</tspan><tspan x="0" dy="46.150000000000006px">1 - Punch</tspan><tspan x="0" dy="46.150000000000006px">2 - Take In Cursed Spirit (Enemy Cursed Spirits With</tspan><tspan x="0" dy="46.150000000000006px">　Less Than Half Of Their Health Can Be Taken In)</tspan><tspan x="0" dy="46.150000000000006px">3 - Change Cursed Spirit Type</tspan><tspan x="0" dy="46.150000000000006px">4 - Take Out Cursed Spirit</tspan><tspan x="0" dy="46.150000000000006px">5 - Return Cursed Spirit</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+5 - Return All Cursed Spirits</tspan><tspan x="0" dy="46.150000000000006px">6 - Maximum: Uzumaki</tspan><tspan x="0" dy="46.150000000000006px">　(Cursed Spirits "Used For Uzumaki" Will Be Consumed)</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+6 - Use Cursed Spirit For Uzumaki</tspan><tspan x="0" dy="46.150000000000006px">7 - New Shadow Style: Simple Domain (Toggle)</tspan></text></g></g></svg>