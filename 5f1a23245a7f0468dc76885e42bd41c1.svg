<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="360" viewBox="0,0,480,360"><g transform="translate(0,0)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(69.87239,17.11061) scale(0.26638,0.26638)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">WASD/⇧⇦⇩⇨ - 移動</tspan><tspan x="0" dy="46.150000000000006px">0 - 反転術式</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+0 - 反転術式のアウトプット</tspan><tspan x="0" dy="46.150000000000006px">1 - 攻撃 (ランダムで黒閃になる)</tspan><tspan x="0" dy="46.150000000000006px">2 - 横攻撃</tspan><tspan x="0" dy="46.150000000000006px">3 - 縦攻撃</tspan><tspan x="0" dy="46.150000000000006px">4 - 里香を出す/戻す</tspan><tspan x="0" dy="46.150000000000006px">　乙骨や里香の攻撃を受けた相手はランダムで体の一部を落とす</tspan><tspan x="0" dy="46.150000000000006px">7 - シン・陰流 簡易領域 (ON/OFF)</tspan><tspan x="0" dy="46.150000000000006px">里香がいるとき</tspan><tspan x="0" dy="46.150000000000006px">　5 - 術式の模倣 (相手の体の一部が必要)</tspan><tspan x="0" dy="46.150000000000006px">　6 -「純愛」呪力砲</tspan><tspan x="0" dy="46.150000000000006px">　8 - 術式の変更</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">WASD/⇧⇦⇩⇨ - Movement</tspan><tspan x="0" dy="46.150000000000006px">0 - Reverse Cursed Technique</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+0 - Output Reverse Cursed Technique</tspan><tspan x="0" dy="46.150000000000006px">1 - Attack (Becomes Black Flash Randomly)</tspan><tspan x="0" dy="46.150000000000006px">2 - Horizontal Attack</tspan><tspan x="0" dy="46.150000000000006px">3 - Vertical Attack</tspan><tspan x="0" dy="46.150000000000006px">4 - Make Rika Come Out/Return</tspan><tspan x="0" dy="46.150000000000006px">　Enemies Attacked By Okkotsu Or Rika Will</tspan><tspan x="0" dy="46.150000000000006px">　Randomly Drop A Part Of Their Body</tspan><tspan x="0" dy="46.150000000000006px">7 - New Shadow Style: Simple Domain (Toggle)</tspan><tspan x="0" dy="46.150000000000006px">When Rika Is Summoned</tspan><tspan x="0" dy="46.150000000000006px">　5 - Copy Cursed Technique (Requires A Part Of The Target's Body)</tspan><tspan x="0" dy="46.150000000000006px">　6 - "Pure Love" Cursed Energy Cannon</tspan><tspan x="0" dy="46.150000000000006px">　8 - Change Cursed Technique</tspan></text><path d="M0,360v-360h480v360z" fill="none" stroke="none"></path></g></g></svg>