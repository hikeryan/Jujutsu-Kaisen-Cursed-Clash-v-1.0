<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600.64999" height="360" viewBox="0,0,600.64999,360"><g transform="translate(120.64999,0)"><g data-paper-data="{&quot;isPaintingLayer&quot;:true}" fill-rule="nonzero" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" style="mix-blend-mode: normal"><text transform="translate(73.46709,24.58295) scale(0.3454,0.3454)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="#000000" stroke-width="0" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0">WASD/⇧⇦⇩⇨ - 移動</tspan><tspan x="0" dy="46.150000000000006px">0 - 反転術式</tspan><tspan x="0" dy="46.150000000000006px">1 - 打撃 (ランダムで黒閃になる)</tspan><tspan x="0" dy="46.150000000000006px">2 - 高速移動 (マウスの位置)</tspan><tspan x="0" dy="46.150000000000006px">3 - 無限 (ON/OFF)</tspan><tspan x="0" dy="46.150000000000006px">4 - 術式順転 蒼 (マウスの位置)</tspan><tspan x="0" dy="46.150000000000006px">5 - 術式反転 赫</tspan><tspan x="0" dy="46.150000000000006px">6 - 虚式 茈</tspan><tspan x="0" dy="46.150000000000006px">7 - 領域展開 無量空処 (ON/OFF)</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+7 - シン・陰流 簡易領域 (ON/OFF)</tspan><tspan x="0" dy="46.150000000000006px"> </tspan><tspan x="0" dy="46.150000000000006px">WASD/⇧⇦⇩⇨ - Movement</tspan><tspan x="0" dy="46.150000000000006px">0 - Reverse Cursed Technique</tspan><tspan x="0" dy="46.150000000000006px">1 - Punch (Becomes Black Flash Randomly)</tspan><tspan x="0" dy="46.150000000000006px">2 - High-speed Movement (To The Cursor)</tspan><tspan x="0" dy="46.150000000000006px">3 - Infinity (Toggle)</tspan><tspan x="0" dy="46.150000000000006px">4 - Cursed Technique Lapse: Blue (At The Cursor)</tspan><tspan x="0" dy="46.150000000000006px">5 - Cursed Technique Reversal: Red</tspan><tspan x="0" dy="46.150000000000006px">6 - Hollow Technique: Purple</tspan><tspan x="0" dy="46.150000000000006px">7 - Domain Expansion: Unlimited Void (Toggle)</tspan><tspan x="0" dy="46.150000000000006px">S/⇩+7 - New Shadow Style: Simple Domain (Toggle)</tspan></text><path d="M0,360v-360h480v360z" fill="none" stroke="none" stroke-width="0"></path><text transform="translate(-43.5,123.5) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"> </tspan></text><text transform="translate(-120.39999,126.4) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"> </tspan></text><text transform="translate(-42.39999,168.2) scale(0.5,0.5)" font-size="40" xml:space="preserve" fill="#ffffff" fill-rule="nonzero" stroke="none" stroke-width="1" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" stroke-dasharray="" stroke-dashoffset="0" font-family="Sans Serif" font-weight="normal" text-anchor="start" style="mix-blend-mode: normal"><tspan x="0" dy="0"> </tspan></text></g></g></svg>